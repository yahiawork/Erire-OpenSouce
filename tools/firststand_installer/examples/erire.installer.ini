# FirstStand Installer project file
# Run from tools/firststand_installer:
#   .\bin\FirstStand-Installer.exe examples\erire.installer.ini

app_name=Erire Core
app_version=1.0.4
publisher=FirstStandStudio

# Folder that contains the final files you want installed.
# Example: put ErireStudio.exe, ErireRunner.exe, erire.exe, assets, docs, etc. here.
source_dir=..\..\release\erire_payload

# Generated self-contained installer.
output=..\..\release\ErireIDE-FirstStand-Setup.exe

# Default user-level install folder. Use {pf} if you want Program Files and admin rights.
install_dir={localappdata}\Programs\{app_name}
main_exe=ErireStudio.exe

# Icon baked into the generated installer EXE.
icon=..\..\assets\brand\erire-logo.ico

# Builder toolchain. MinGW names are enough when gcc/windres are in PATH.
gcc=gcc
windres=windres
bash=C:\msys64\usr\bin\bash.exe
use_msys_bash=true
stub_source=src\firststand_stub.c

# License activation against your Flask site.
require_key=true
activation_url=https://erire.pythonanywhere.com/api/activate
api_key=
google_required=true

desktop_shortcut=true
start_menu_shortcut=true
run_after_install=false

